<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Context Medical Platform Dashboard</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 20px; }
        h1 { color: #1a365d; margin-bottom: 5px; }
        .subtitle { color: #4a5568; margin-bottom: 25px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .full-width { grid-column: span 2; }
        h2 { color: #2b6cb0; margin-top: 0; border-bottom: 2px solid #edf2f7; padding-bottom: 10px; }
        label { display: block; margin-top: 10px; font-weight: 600; color: #4a5568; }
        input { width: 100%; padding: 8px 12px; margin-top: 5px; border: 1px solid #cbd5e0; border-radius: 5px; }
        button { margin-top: 15px; background-color: #3182ce; color: white; border: none; padding: 10px 18px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #2b6cb0; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; }
        th { background-color: #ebf8ff; color: #2b6cb0; }
        .status-badge { background: #c6f6d5; color: #22543d; padding: 3px 8px; border-radius: 12px; font-size: 12px; }
    </style>
</head>
<body>

    <h1>Context Medical Platform</h1>
    <p class="subtitle">System Operator: Kintex Medical Health | Backend API Status: <span class="status-badge" id="apiStatus">Checking...</span></p>

    <div class="grid">
        <!-- 1. Patient Registration -->
        <div class="card">
            <h2>Register New Patient</h2>
            <form id="patientForm">
                <label>Full Name</label>
                <input type="text" id="patientName" placeholder="e.g. Sara Zainab" required>
                
                <label>Age</label>
                <input type="number" id="patientAge" placeholder="e.g. 35" required>
                
                <label>Contact Number</label>
                <input type="text" id="patientContact" placeholder="e.g. +923001234567" required>
                
                <button type="submit">Add Patient</button>
            </form>
        </div>

        <!-- 2. Medical Billing Generator -->
        <div class="card">
            <h2>Generate Medical Bill</h2>
            <form id="billingForm">
                <label>Patient ID</label>
                <input type="number" id="billPatientId" placeholder="e.g. 1" required>
                
                <label>Service / Treatment</label>
                <input type="text" id="billService" placeholder="e.g. General Consultation & Lab Test" required>
                
                <label>Amount ($)</label>
                <input type="number" step="0.01" id="billAmount" placeholder="e.g. 150.00" required>
                
                <button type="submit" style="background-color: #38a169;">Create Bill</button>
            </form>
        </div>

        <!-- 3. Live System Audit Logs -->
        <div class="card full-width">
            <h2>System Audit Logs <button onclick="fetchAuditLogs()" style="float: right; margin-top: -5px; padding: 5px 10px; font-size: 12px;">Refresh Logs</button></h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Timestamp</th>
                        <th>Event</th>
                        <th>Details</th>
                        <th>IP Address</th>
                    </tr>
                </thead>
                <tbody id="auditLogsTable">
                    <tr><td colspan="5">Loading audit logs...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        // Check API Status
        async function checkStatus() {
            try {
                const res = await fetch(`${API_URL}/`);
                const data = await res.json();
                if (data.status === 'Active') {
                    document.getElementById('apiStatus').innerText = 'Connected';
                    document.getElementById('apiStatus').style.background = '#c6f6d5';
                    document.getElementById('apiStatus').style.color = '#22543d';
                }
            } catch (err) {
                document.getElementById('apiStatus').innerText = 'Backend Unreachable';
                document.getElementById('apiStatus').style.background = '#fed7d7';
                document.getElementById('apiStatus').style.color = '#9b2c2c';
            }
        }

        // Register Patient Form Handler
        document.getElementById('patientForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Page refresh hone se roknay ke liye

            const payload = {
                full_name: document.getElementById('patientName').value,
                age: parseInt(document.getElementById('patientAge').value),
                contact: document.getElementById('patientContact').value
            };

            try {
                const res = await fetch(`${API_URL}/patients/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert('Patient Registered Successfully!');
                    document.getElementById('patientForm').reset();
                    fetchAuditLogs();
                } else {
                    alert('Server Error: Patient registration failed.');
                }
            } catch (err) {
                alert('Medical backend could not be reached. Make sure Uvicorn server is running on http://127.0.0.1:8000');
            }
        });

        // Generate Billing Claim Handler
        document.getElementById('billingForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Page refresh hone se roknay ke liye

            const payload = {
                patient_id: parseInt(document.getElementById('billPatientId').value),
                service_name: document.getElementById('billService').value,
                amount: parseFloat(document.getElementById('billAmount').value)
            };

            try {
                const res = await fetch(`${API_URL}/billing/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert('Medical Bill Created Successfully!');
                    document.getElementById('billingForm').reset();
                    fetchAuditLogs();
                } else {
                    alert('Error: Patient ID not found in database.');
                }
            } catch (err) {
                alert('Medical backend could not be reached. Make sure Uvicorn server is running on http://127.0.0.1:8000');
            }
        });

        // Fetch System Audit Logs
        async function fetchAuditLogs() {
            try {
                const res = await fetch(`${API_URL}/audit-logs/`);
                const logs = await res.json();
                const tbody = document.getElementById('auditLogsTable');
                tbody.innerHTML = '';

                if (logs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5">No audit logs found.</td></tr>';
                    return;
                }

                logs.forEach(log => {
                    const row = `<tr>
                        <td>${log.id}</td>
                        <td>${new Date(log.timestamp).toLocaleString()}</td>
                        <td><strong>${log.event}</strong></td>
                        <td>${log.details}</td>
                        <td>${log.ip_address}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            } catch (err) {
                console.error("Failed to load audit logs", err);
            }
        }

        // Initialize Page
        checkStatus();
        fetchAuditLogs();
    </script>
</body>
</html>
